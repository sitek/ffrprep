name: Build and Publish Container

# The events/triggers when it should be run
# Here we set that the workflow should run
# whenever there was a push or PR to the
# main branch, or a version tag (e.g. v0.2.0)
# was pushed
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

# We define the jobs that should be run
# and the respective runner, ie virtual machine
# Here, the workflow runs on the latest ubuntu
jobs:
  # define job to build and publish docker image
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-latest

    # set permissions for the workflow
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    # Below we define all steps that should be
    # run within the workflow
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # setup Docker buld action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      # login to DockerHub and GitHub Container Registry
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_FFRPREP }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FFRPREP }}

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # figure out which image tags to build:
      # always "latest", plus a version tag (e.g. "0.2.0") when this
      # run was triggered by pushing a "vX.Y.Z" git tag
      - name: Determine image tags
        id: image_tags
        run: |
          tags="ksitek/ffrprep:latest
          ghcr.io/sitek/ffrprep:latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tags="${tags}
          ksitek/ffrprep:${version}
          ghcr.io/sitek/ffrprep:${version}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # build and push the image to DockerHub and GitHub Container Registry
      - name: Build image and push to Docker Hub and GitHub Container Registry
        uses: docker/build-push-action@v2
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./
          # Note: tags has to be all lower-case
          tags: ${{ steps.image_tags.outputs.tags }}
          # build on feature branches, push only on main or a version tag
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
