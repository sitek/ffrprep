[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ffrprep"
description = "A standardized and robust (pre-) processing pipeline for FFR data."
readme = "README.rst"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Kevin Sitek" },
    { name = "Peer Herholz" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dynamic = ["version"]
dependencies = [
    "bids-validator-deno",
    "h5io>=0.2.5",
    "h5py>=3.10",
    "matplotlib>=3.10.1",
    "mne>=1.9.0",
    "mne-bids>=0.16.0",
    "nipype>=1.9.2",
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "pybids>=0.15.0",
    "requests>=2.32.3",
    "scipy>=1.15.2",
    "statsmodels>=0.14.0",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/SPARK-CSD/ffrprep"
Repository = "https://github.com/SPARK-CSD/ffrprep"

[project.scripts]
ffrprep = "ffrprep.ffrprep_cli:run_ffrprep"
ffrprep-download = "ffrprep.download_cli:run_download"

[dependency-groups]
dev = [
    "black>=25.9.0",
    "coverage>=7.6.10",
    "flake8>=7.1.1",
    "pytest>=8.3.4",
]
docs = [
    "numpydoc>=1.8.0",
    "sphinx>=8.1.3",
    "sphinx-design>=0.6.1",
    "sphinx-gallery>=0.18.0",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.setuptools.packages.find]
include = ["ffrprep*"]
exclude = ["docs*", "tests*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["ffrprep/tests"]
cache_dir = "/tmp/.pytest_cache"
markers = [
    "integration: tests that read downloaded data",
    "system: tests that invoke the full pipeline",
]

[tool.uv]
package = true

[tool.black]
line-length = 115
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | blib2to3
  | tests/data
)/
'''
